name: Supabase Database Backup

on:
  schedule:
    # Roda todos os dias à meia-noite (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar o backup manualmente pelo painel do GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create Backup Directory
        run: mkdir -p backups

      - name: Backup Database
      
        run: |
          supabase db dump -f backups/database_backup.sql --db-url "${{ secrets.SUPABASE_DB_URL }}"

      - name: Commit and Push Backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/database_backup.sql
          
          # O commit falha se o arquivo não tiver mudado (banco intacto desde o último backup).
          # O || echo "..." impede que o workflow falhe por causa disso.
          git commit -m "chore: backup diário automático do banco Supabase [skip ci]" || echo "Nenhuma mudança no banco para commitar."
          git push
