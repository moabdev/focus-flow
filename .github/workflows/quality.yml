name: Quality Assurance & CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality Gates (TypeCheck, Lint, Tests, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. TypeCheck (TypeScript tsc --noEmit)
        run: npm run typecheck

      - name: 2. Static Analysis (ESLint)
        run: npm run lint

      - name: 3. Unit & Component Tests + Coverage (Vitest)
        run: npm run test:coverage

      - name: 4. Production Build (Vite)
        run: npm run build
